<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Beranda Pemesanan</title>
  </head>
  <body>
    <h1>MENU MEULABOH PREMIUM</h1>
    <p>Pilih minuman favoritmu!</p>

    <!-- ====== KOLOM PENCARIAN & KATEGORI ====== -->
    <div id="kontrol-menu">
      <input type="text" id="input-cari" placeholder="🔍 Cari minuman..." />
      <div id="tombol-kategori">
        <!-- Tombol kategori bakal otomatis dibikin sama JavaScript -->
      </div>
    </div>

    <!-- Ini kotak besar buat semua minuman -->
    <div id="daftar-menu"></div>

    <div id="keranjang">
      <h2>Keranjang</h2>
      <div id="isi-keranjang">
        <p class="kosong">Belum ada pesanan</p>
      </div>
      <div id="total-baris">
        <strong>Total:</strong>
        <strong id="total-harga">Rp 0</strong>
      </div>
      <button id="tombol-checkout">Checkout</button>
    </div>

    <!-- ====== MODAL FORM PEMESAN ====== -->
    <div id="modal-pemesan" class="modal-sembunyi">
      <div class="modal-box">
        <h2>📋 Data Pemesan</h2>

        <label>Nama</label>
        <input type="text" id="input-nama" placeholder="Nama kamu" />

        <label>No Meja / Alamat</label>
        <input
          type="text"
          id="input-alamat"
          placeholder="Contoh: Meja 5 / Jl. Merdeka No. 10"
        />

        <label>Catatan (opsional)</label>
        <textarea
          id="input-catatan"
          placeholder="Contoh: esnya dikit"
        ></textarea>

        <p id="pesan-error"></p>

        <div class="modal-tombol">
          <button id="tombol-batal">Batal</button>
          <button id="tombol-kirim">Kirim Pesanan</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
